<style>
  :root {
    --btn-a-bg: #2563eb;
    --btn-a-hover: #1d4ed8;
    --btn-b-bg: #e11d48;
    --btn-b-hover: #be123c;
    --btn-text: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --btn-a-bg: #1e40af;
      --btn-a-hover: #1e3a8a;
      --btn-b-bg: #9f1239;
      --btn-b-hover: #881337;
      --btn-text: #f8fafc;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #000; }
  .wrap { display: flex; width: 100%; height: 100%; }
  button {
    flex: 1;
    border: none;
    border-radius: 0;
    color: var(--btn-text);
    font: 600 clamp(1.5rem, 5vw, 3rem) system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  #a { background: var(--btn-a-bg); }
  #a:hover, #a:focus-visible { background: var(--btn-a-hover); }
  #b { background: var(--btn-b-bg); }
  #b:hover, #b:focus-visible { background: var(--btn-b-hover); }
  button:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }
</style>
</head>
<body>
  <div class="wrap">
    <button id="a" type="button" onclick="location.href='https://kitchen.zanteri.com/food'">Food</button>
    <button id="b" type="button" onclick="location.href='https://kitchen.zanteri.com/drinks'">Drinks</button>
  </div>
</body>
