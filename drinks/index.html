<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drink Recipies</title>
<style>
  :root {
    --bg: #ffffff;
    --btn-bg: #2563eb;
    --btn-hover: #1d4ed8;
    --btn-text: #ffffff;
    --gap: 12px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --btn-bg: #1e40af;
      --btn-hover: #1e3a8a;
      --btn-text: #f8fafc;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    padding: var(--gap);
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }
  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
  }
  .row button {
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 12px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font: 600 clamp(0.9rem, 3vw, 1.5rem) system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer;
    transition: background-color 0.15s ease;
    background: url('images/photo.jpg') center / cover no-repeat;
  }
  .row button:hover, .row button:focus-visible {
  background: url('images/photo.jpg') center / cover no-repeat;
  filter: brightness(0.85); /* hover effect, since the hover color no longer applies */
  }
  .outlined {
  color: #fff;
  -webkit-text-stroke: 2px #000;
  paint-order: stroke fill;
  }

</style>
</head>
<body>
 
  <!-- ===== ROW: copy everything from here to "END ROW" and paste below to add a row ===== -->
  <div class="row">
    <button type="button" class="outlined" style="background-image: url('tokyo_tea.jpg')" onclick="location.href='tokyo_tea'" >Tokyo Tea</button>
    <button type="button" class="outlined" style="background-image: url('images/cat.jpg')" onclick="location.href='#'">Gummy Shark</button>
    <button type="button" class="outlined" style="background-image: url('images/cat.jpg')" onclick="location.href='jolly_rancher'">Jolly Rancher</button>
    <button type="button" class="outlined" style="background-image: url('images/cat.jpg')" onclick="location.href='#'">Beergarita</button>
  </div>
  <!-- ===== END ROW ===== -->
 
</body>
</html>
